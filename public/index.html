<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Between Us</title><style>body{margin:0;background:linear-gradient(140deg,#170b16,#42162b);color:#ffe8e5;font:16px system-ui}main{max-width:900px;margin:auto;padding:30px 16px}h1{font:56px Georgia;margin:10px 0;color:#f5c7bd}h2{font:30px Georgia}p{line-height:1.6}.box{background:#ffffff0d;border:1px solid #ffffff24;border-radius:22px;padding:24px;margin:16px 0}input,textarea,button{box-sizing:border-box;font:inherit;border-radius:12px;padding:13px;border:1px solid #ffffff55}input,textarea{background:#220f20;color:white;width:100%;margin:7px 0}button{background:#e7afa9;color:#24101e;cursor:pointer;font-weight:700;margin:5px 5px 5px 0}button:disabled{opacity:.5;cursor:default}.muted{color:#d6b8c5}.chat{height:220px;overflow:auto;background:#180a15;border-radius:12px;padding:12px}.msg{padding:7px;border-bottom:1px solid #ffffff18;overflow-wrap:anywhere}.hidden{display:none}small{color:#e6b8c6}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}</style></head><body><main><small>THE CONVERSATION GAME</small><h1>Between Us</h1><p>Where conversations become connection.</p><div id="entry" class="box"><h2>Just the two of you.</h2><p>Honesty, real emotion, fun and maturity. Stay engaged, but take your time. You can pass on anything uncomfortable.</p><input id="name" placeholder="Your name" maxlength="24"><div class="row"><button onclick="create()">Create private room</button><input id="code" placeholder="6-character room code" maxlength="6"><button onclick="join()">Join room</button></div><p id="notice"></p></div><div id="game" class="hidden"><div class="box"><div class="row"><div><small>PRIVATE ROOM</small><h2 id="room"></h2><button onclick="copy()">Copy invite link</button></div><div><small>PLAYERS</small><p id="players"></p></div></div></div><div class="box"><small id="progress"></small><h2 id="title"></h2><p id="prompt"></p><div id="responses"></div><div id="actions"></div><p id="twist"></p></div><div class="box"><h2>Our conversation</h2><div id="chat" class="chat"></div><small id="typing"></small><div class="row"><input id="message" placeholder="Say something..." maxlength="600" oninput="typing()"><button onclick="send()">Send</button></div></div></div></main><script src="/socket.io/socket.io.js"></script><script>const s=io(),$=id=>document.getElementById(id);let state,session;try{session=JSON.parse(localStorage.getItem('betweenus')||'null')}catch{}const params=new URLSearchParams(location.search);if(params.get('room'))$('code').value=params.get('room');if(session){$('name').value=session.name;s.emit('join',session)}function create(){s.emit('create',{name:$('name').value})}function join(){s.emit('join',{name:$('name').value,code:$('code').value.toUpperCase(),token:session?.code===$('code').value.toUpperCase()?session.token:null})}function copy(){navigator.clipboard?.writeText(location.origin+'/?room='+state.code).then(()=>alert('Invite link copied'))}function send(){let text=$('message').value.trim();if(text){s.emit('chat',{text});$('message').value='';s.emit('typing',{active:false})}}let tt;function typing(){s.emit('typing',{active:true});clearTimeout(tt);tt=setTimeout(()=>s.emit('typing',{active:false}),1000)}s.on('typing',v=>{$('typing').textContent=v.active?v.name+' is typing...':''});s.on('notice',m=>$('notice').textContent=m);s.on('joined',v=>{session=v;localStorage.setItem('betweenus',JSON.stringify(v));history.replaceState(null,'','/?room='+v.code)});function el(tag,text,parent){const e=document.createElement(tag);e.textContent=text;parent.append(e);return e}function btn(label,fn,parent){const b=el('button',label,parent);b.onclick=fn;return b}s.on('state',v=>{state=v;$('entry').classList.add('hidden');$('game').classList.remove('hidden');$('room').textContent=v.code;$('players').textContent=v.players.map(p=>p.name+(p.online?' • online':' • offline')).join(' | ');$('progress').textContent=v.phase==='lobby'?'Waiting room':v.phase==='finished'?'Complete':'Chapter '+(v.category+1)+' / 9 · Question '+(v.question+1);$('title').textContent=v.phase==='lobby'?'Ready to begin?':v.phase==='finished'?'A little closer.':v.title;$('prompt').textContent=v.phase==='lobby'?'Both players must be ready to begin.':v.phase==='finished'?'Thanks for sharing this moment.':v.prompt;const a=$('actions'),r=$('responses');a.replaceChildren();r.replaceChildren();$('twist').textContent=v.twistMessage||'';if(v.phase==='lobby'){if(!v.players.find(p=>p.id===v.you)?.ready)btn('I am ready',()=>s.emit('ready'),a);else el('p','Waiting for the other player...',a)}if(v.phase==='playing'){let mine=v.turn===v.you;if(mine){const t=el('textarea','',a);t.placeholder='Your answer, question, or dare...';t.rows=3;btn('Submit answer',()=>s.emit('answer',{text:t.value}),a);btn('Pass',()=>s.emit('pass'),a)}else el('p','Waiting for your partner to answer...',a);if(!v.players.find(p=>p.id===v.you)?.twist){const d=el('select','',a);[['','Choose one-time Twist'],['swap','Switch who answers first'],['revisit','Revisit a previous answer'],['double','Ask for extra detail'],['both','Answer together']].forEach(([val,label])=>{const o=el('option',label,d);o.value=val});btn('Use Twist',()=>{if(d.value)s.emit('twist',{kind:d.value})},a)}}if(v.phase==='reveal'){v.players.forEach(p=>{el('h3',p.name,r);el('p',v.responses[p.id]||'',r)});btn('Next question',()=>s.emit('next'),a)}const c=$('chat');c.replaceChildren();v.chat.forEach(m=>el('div',m.name+': '+m.text,c).className='msg');c.scrollTop=c.scrollHeight});$('message').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send()}});</script></body></html>
